services:
  keycloak-db:
    image: postgres:16
    env_file:
      - ./env/keycloak-db.env
    environment:
      # unset PGHOST as db service crashes otherwise
      PGHOST:


  keycloak:
    image: swh/keycloak
    build: services/keycloak
    depends_on:
      keycloak-db:
        condition: service_started
      docker-helper:
        condition: service_healthy
    env_file:
      - ./env/keycloak.env
    entrypoint: /srv/softwareheritage/entrypoint.sh
    healthcheck:
      test: curl -f --max-time 1 http://localhost:8080/keycloak/realms/SoftwareHeritage/ || exit 1
      interval: 5s
      retries: 20
    volumes:
      - "./services/keycloak/entrypoint.sh:/srv/softwareheritage/entrypoint.sh:ro"
      - "./services/keycloak/keycloak_swh_setup.py:/keycloak_swh_setup.py:ro"

  swh-web:
    depends_on:
      keycloak:
        condition: service_healthy
      docker-helper:
        condition: service_healthy
    environment:
      SWH_CONFIG_FILENAME: /srv/softwareheritage/config-kc.yml
    volumes:
      - "./conf/web-keycloak.yml:/srv/softwareheritage/config-kc.yml.in:ro"

  swh-graphql:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      SWH_CONFIG_FILENAME: /srv/softwareheritage/config-kc.yml
    volumes:
      - "./conf/graphql-keycloak.yml:/srv/softwareheritage/config-kc.yml.in:ro"
