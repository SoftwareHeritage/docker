services:
  winery-s3:
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: testing_key
      GARAGE_DEFAULT_SECRET_KEY: testing_long_enough_secret
      GARAGE_DEFAULT_BUCKET: winery
    image: dxflrs/garage:v2.5.0
    command: /garage server --single-node --default-bucket
    volumes:
      - "./conf/garage.toml:/etc/garage.toml:ro"

  winery-db:
    image: postgres:16
    environment:
      POSTGRES_DB: winery
      POSTGRES_PASSWORD: testpassword
    volumes:
      - "./services/initdb.d:/docker-entrypoint-initdb.d"

  winery-packer:
    image: swh/stack:${SWH_IMAGE_TAG:-latest}
    build: ./
    env_file:
      - ./env/common_python.env
    volumes:
      - "./conf/objstorage-winery-s3.yml:/srv/softwareheritage/config.yml:ro"
      - "./services/swh-objstorage/entrypoint.sh:/srv/softwareheritage/entrypoint.sh:ro"
    depends_on:
      - winery-db
      - winery-s3
      - swh-objstorage
    environment:
      POSTGRES_DB: winery
    command: winery-packer --pool-name all

  winery-cleaner:
    image: swh/stack:${SWH_IMAGE_TAG:-latest}
    build: ./
    env_file:
      - ./env/common_python.env
    volumes:
      - "./conf/objstorage-winery-s3.yml:/srv/softwareheritage/config.yml:ro"
      - "./services/swh-objstorage/entrypoint.sh:/srv/softwareheritage/entrypoint.sh:ro"
    depends_on:
      - winery-db
      - winery-s3
      - swh-objstorage
    environment:
      POSTGRES_DB: winery
    command: winery-cleaner

  swh-objstorage:
    image: swh/stack:${SWH_IMAGE_TAG:-latest}
    build: ./
    env_file:
      - ./env/common_python.env
    volumes:
      - "./conf/objstorage-winery-s3.yml:/srv/softwareheritage/config.yml:ro"
      - "./services/swh-objstorage/entrypoint.sh:/srv/softwareheritage/entrypoint.sh:ro"
    environment:
      POSTGRES_DB: winery
      GUNICORN_THREADS: 1
      SWH_LOG_LEVEL: DEBUG
      SWH_OPTIONS: ${SWH_OPTIONS:-}
    command: winery-rpc

